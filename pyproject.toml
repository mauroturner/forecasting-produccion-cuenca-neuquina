[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oilgas"
version = "0.1.0"
description = "Per-well oil and gas production forecast: Arps decline curves versus machine learning, walk-forward P10/P50/P90."
requires-python = ">=3.11,<3.12"
# Runtime and development dependencies are pinned in requirements.txt and requirements-dev.txt (decision D17).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# "src" makes the package importable without installing it; "." makes tests.fixtures importable.
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --import-mode=importlib -m 'not real_data and not docker'"
markers = [
    "real_data: needs the real publication in data/raw/ (skipped by default)",
    "docker: needs Docker (skipped by default)",
    "slow: takes more than a few seconds",
]
