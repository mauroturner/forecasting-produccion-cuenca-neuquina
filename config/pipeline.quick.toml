# Quick mode for tests and development: the same pipeline on a small backtest, on a synthetic publication.
# Starts from pipeline.toml (same folder) and overrides only what is listed here.
#
#   python -m oilgas make-fixture data/quick/publication.csv
#   python -m oilgas run --config config/pipeline.quick.toml
#
# Everything the quick run reads and writes is under data/quick/ (git-ignored): it never touches the warehouse, the
# Parquet files, the HTML design or the reports of the full run, which are versioned. Run it from the project folder.
extends = "pipeline.toml"

[source]
mode = "local"
local_path = "data/quick/publication.csv"

[backtest]
n_eval_origins = 6
n_warmup_origins = 6
n_workers = 1

[ml]
max_iter = 40
max_train_rows = 20000
retrain_every = 6

[paths]
raw_dir = "data/quick/raw"
interim_dir = "data/quick/interim"
warehouse = "data/quick/production.sqlite"
outputs_dir = "data/quick/outputs/powerbi"
reports_dir = "data/quick/reports"
dashboard_html = "data/quick/dashboard/powerbi-design.html"
readme = "data/quick/README.md"
